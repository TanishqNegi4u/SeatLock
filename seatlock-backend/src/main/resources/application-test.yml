spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/seatlock
    username: seatlock
    password: seatlockpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

seatlock:
  locking-strategy: PESSIMISTIC
  lock-ttl-minutes: 1             # Shorter TTL for tests
  reaper-interval-ms: 5000
  waiting-room:
    admission-batch-size: 10
    admission-interval-ms: 2000
  payment:
    failure-rate: 0.0              # Deterministic in tests by default
    simulated-delay-ms: 0
    intermittent-failure-rate: 0.0
