version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seatlock-postgres
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlockpassword
      POSTGRES_DB: seatlock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./seatlock-backend
    container_name: seatlock-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/seatlock
      - SPRING_DATASOURCE_USERNAME=seatlock
      - SPRING_DATASOURCE_PASSWORD=seatlockpassword
      - SEATLOCK_LOCKING_STRATEGY=PESSIMISTIC
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./seatlock-frontend
    container_name: seatlock-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: seatlock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    container_name: seatlock-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
